.light{background:#f7f7f2;color:#24251e}
h2{grid-column:1/-1;margin:4px 0 0 4px;font:600 12px Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.small{display:flex;gap:14px;align-items:end}
svg{display:block}
</style>

<div class="sheet" id="dark"></div>
<div class="sheet light" id="light"></div>
<script>
const pets=[["collie","Border collie"],["redpanda","Red panda"],["otter","Otter"],["panda","Panda"]];
for (const id of ["dark","light"]) {
  const el=document.getElementById(id);
  el.innerHTML=`<h2>${id==="dark"?"Dark desktop":"Light desktop"} · 200px preview · 96px / 64px actual</h2>`+
   pets.map(([k,n])=>`<div class="cell"><svg width="200" height="200"><use href="#${k}"/></svg>
   <div class="small"><svg width="96" height="96"><use href="#${k}"/></svg><svg width="64" height="64"><use href="#${k}"/></svg></div>
   <span>${n}</span></div>`).join("");
}
</script>
